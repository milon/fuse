name: docs-site

# Builds docs to verify Papyrus config. Live site is deployed from milon/oss
# to https://oss.milon.im/fuse/

on:
  push:
    branches: [main, master]
    paths:
      - "docs-src/**"
      - "art/**"
      - ".github/workflows/docs-site.yml"
  pull_request:
    paths:
      - "docs-src/**"
      - "art/**"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, mbstring, zip, zlib
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Download Papyrus PHAR
        env:
          PAPYRUS_VERSION: "1.5.0"
        run: |
          curl -fsSL -o papyrus.phar \
            "https://github.com/milon/papyrus/releases/download/v${PAPYRUS_VERSION}/papyrus.phar"
          chmod +x papyrus.phar
          php papyrus.phar --version

      - name: Build documentation site
        env:
          PAPYRUS_BIN: php ${{ github.workspace }}/papyrus.phar
        run: |
          docs-src/bin/build-site
          test -f docs/milon-fuse-site/index.html
          grep -q 'base href="/fuse/"' docs/milon-fuse-site/index.html
          grep -q 'oss.milon.im' docs/milon-fuse-site/CNAME
