<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="milon/fuse - HTTP-client-agnostic circuit breaker for PHP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="pcb" width="200" height="200" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 40H50L70 60H130"/>
        <path d="M20 200V150L40 130H90"/>
        <path d="M110 0V30L130 50V100L150 120H200"/>
        <path d="M160 200V170L180 150H200"/>
        <path d="M0 110H30L50 90"/>
        <path d="M70 200V180"/>
        <path d="M200 40H170"/>
      </g>
      <g fill="#ffffff" stroke="#6366f1" stroke-width="2">
        <circle cx="130" cy="60" r="4"/>
        <circle cx="90" cy="130" r="4"/>
        <circle cx="50" cy="90" r="4"/>
        <circle cx="70" cy="180" r="4"/>
        <circle cx="170" cy="40" r="4"/>
      </g>
      <g fill="#6366f1">
        <rect x="146" y="76" width="8" height="8" rx="1.5"/>
        <rect x="16" y="66" width="8" height="8" rx="1.5"/>
      </g>
    </pattern>
    <linearGradient id="pcbFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.22" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="pcbMask">
      <rect width="1280" height="400" fill="url(#pcbFade)"/>
    </mask>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#pcb)" opacity="0.22" mask="url(#pcbMask)"/>

  <!-- Chip -->
  <g transform="translate(940 150)">
    <g stroke="#6366f1" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M20 0V-30L-10 -60H-60"/>
      <path d="M50 0V-50"/>
      <path d="M80 0V-30L110 -60H170"/>
      <path d="M20 100V130L0 150H-90"/>
      <path d="M50 100V160"/>
      <path d="M80 100V130L100 150H200"/>
      <path d="M100 30H140L160 10H230"/>
      <path d="M100 70H250"/>
      <path d="M0 50H-60"/>
    </g>
    <g fill="#ffffff" stroke="#6366f1" stroke-opacity="0.55" stroke-width="2.5">
      <circle cx="-60" cy="-60" r="5"/>
      <circle cx="50" cy="-50" r="5"/>
      <circle cx="170" cy="-60" r="5"/>
      <circle cx="-90" cy="150" r="5"/>
      <circle cx="50" cy="160" r="5"/>
      <circle cx="230" cy="10" r="5"/>
      <circle cx="-60" cy="50" r="5"/>
    </g>
    <rect width="100" height="100" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-opacity="0.45" stroke-width="2.5"/>
    <rect x="22" y="22" width="56" height="56" rx="6" fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="16" cy="16" r="4" fill="#6366f1" fill-opacity="0.4"/>
  </g>

  <!-- Circuit trace with breaker gap -->
  <g fill="none" stroke="#6366f1" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
    <path d="M0 375H140L165 350H300"/>
    <path d="M380 350H520L545 375H760"/>
    <path d="M1280 50H1100L1075 75H960"/>
  </g>
  <g fill="#6366f1" fill-opacity="0.55">
    <circle cx="300" cy="350" r="6"/>
    <circle cx="380" cy="350" r="6"/>
    <circle cx="960" cy="75" r="6"/>
  </g>
  <path d="M312 350L368 332" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>

  <!-- Fuse icon -->
  <g transform="translate(150 105)">
    <rect width="150" height="150" rx="36" fill="#ffffff" stroke="#c7d2fe" filter="url(#shadow)"/>
    <!-- glass tube -->
    <rect x="32" y="40" width="86" height="70" rx="14" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2.5"/>
    <rect x="42" y="48" width="66" height="16" rx="8" fill="#ffffff" fill-opacity="0.75"/>
    <!-- filament -->
    <path d="M46 75C54 58 64 92 74 75S94 58 104 75" fill="none" stroke="url(#spark)" stroke-width="4" stroke-linecap="round"/>
    <!-- metal end caps -->
    <rect x="16" y="48" width="26" height="54" rx="6" fill="#94a3b8"/>
    <rect x="108" y="48" width="26" height="54" rx="6" fill="#64748b"/>
    <rect x="21" y="54" width="6" height="42" rx="3" fill="#f1f5f9" fill-opacity="0.85"/>
    <rect x="113" y="54" width="6" height="42" rx="3" fill="#cbd5e1" fill-opacity="0.7"/>
  </g>

  <!-- Title -->
  <text x="340" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="#0f172a" letter-spacing="-2">fuse</text>
  <text x="340" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#475569">HTTP-client-agnostic circuit breaker for PHP 8.2+</text>

  <!-- State pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600">
    <g transform="translate(340 262)">
      <rect width="120" height="36" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-opacity="0.7"/>
      <circle cx="22" cy="18" r="6" fill="#16a34a"/>
      <text x="38" y="24" fill="#166534">closed</text>
    </g>
    <g transform="translate(476 262)">
      <rect width="104" height="36" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-opacity="0.7"/>
      <circle cx="22" cy="18" r="6" fill="#dc2626"/>
      <text x="38" y="24" fill="#991b1b">open</text>
    </g>
    <g transform="translate(596 262)">
      <rect width="150" height="36" rx="18" fill="#fef9c3" stroke="#eab308" stroke-opacity="0.8"/>
      <circle cx="22" cy="18" r="6" fill="#ca8a04"/>
      <text x="38" y="24" fill="#854d0e">half-open</text>
    </g>
  </g>

  <!-- Install hint -->
  <text x="1130" y="360" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#64748b">composer require milon/fuse</text>
</svg>
