# milon/fuse — Papyrus docs site (milon/papyrus ^1.5)
title: milon/fuse
subtitle: Circuit breaker for PHP, Laravel, and Saloon
author: Nuruzzaman Milon
themes:
  - light
  - dark

document:
  size: a4
  margin_left: 25
  margin_right: 25
  margin_top: 20
  margin_bottom: 20

toc:
  h1: 0
  h2: 0
  h3: 1

site:
  banner: banner.svg
  lead: 'Stop calling a failing dependency, then let a few trial calls through when it might have recovered.'
  cname: oss.milon.im
  base_path: /fuse
  version: latest
  repository: 'https://github.com/milon/fuse'
  edit:
    link: true
    path: docs-src/content
    branch: master
  copy_code: true
  copy_markdown: true
  print_page: true
  page_toc: true
  links:
    - label: GitHub
      url: 'https://github.com/milon/fuse'
    - label: Packagist
      url: 'https://packagist.org/packages/milon/fuse'
    - label: Issues
      url: 'https://github.com/milon/fuse/issues'
    - label: How it works
      chapter: 02-how-it-works.md
    - label: Scenarios
      chapter: 11-scenarios.md
  nav:
    - group: Getting started
      chapters:
        - 00-welcome.md
        - 01-installation.md
        - 02-how-it-works.md
        - 03-configuration.md
    - group: Usage
      chapters:
        - 04-plain-php.md
        - 05-failures.md
        - 06-stores.md
        - 07-laravel.md
        - 08-database.md
        - 09-saloon.md
        - 10-laravel-and-saloon.md
    - group: Reference
      chapters:
        - 11-scenarios.md
        - 12-controlling-the-breaker.md
        - 13-faq.md
        - 14-license.md

header:
  style: 'font-style: italic; text-align: right; border-bottom: solid 1px #808080;'

fonts:
  faces:
    - name: librelibertine
      regular: LinLibertine_R.ttf
      bold: LinLibertine_RB.ttf
      italic: LinLibertine_RI.ttf
      bold_italic: LinLibertine_RBI.ttf
    - name: oxproto
      regular: 0xProto-Regular.ttf
      bold: 0xProto-Bold.ttf
      italic: 0xProto-Italic.ttf
      otl: true
  script: {}

mermaid:
  enabled: true
  format: svg
  theme: auto
  max_width_mm: 130
